spring.application.name=markcraft
server.address=127.0.0.1
server.port=8080
markcraft.vault.root=${user.home}/.markcraft/vault
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.ai.mcp.server.enabled=${markcraft.mcp.enabled:false}
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=markcraft
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
