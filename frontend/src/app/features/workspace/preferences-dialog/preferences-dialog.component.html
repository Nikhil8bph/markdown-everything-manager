<section class="dialog" cdkTrapFocus cdkTrapFocusAutoCapture role="dialog" aria-modal="true" aria-labelledby="preferences-title" (keydown)="keydown($event)"><h2 id="preferences-title">Preferences</h2><label>Theme<select [value]="prefs().theme" (change)="set('theme', $any($event.target).value)"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></label><label>Editor font size<select [value]="prefs().fontSize" (change)="set('fontSize', +$any($event.target).value)"><option value="12">12px</option><option value="14">14px</option><option value="16">16px</option><option value="18">18px</option></select></label><label><input type="checkbox" [checked]="prefs().wordWrap" (change)="set('wordWrap',$any($event.target).checked)"/> Word wrap</label><label><input type="checkbox" [checked]="prefs().sidebar" (change)="set('sidebar',$any($event.target).checked)"/> Show sidebar</label><p>Saved locally in this browser.</p><button type="button" (click)="dismiss.emit()">Close</button></section>
